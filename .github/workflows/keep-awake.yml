# Holder Streamlit Community Cloud-appen (Topas Tid) vågen i arbejdstiden.
# Apps sover efter ~12 timers inaktivitet — et ping hver 30. minut
# på hverdage forhindrer at første bruger om morgenen skal vente på opvågning.
#
# Ligger i topas-tid-web (public repo) fordi Actions-minutter er gratis
# i public repos — i private repos tæller de på konto-limitet.

name: Keep app awake

on:
  schedule:
    # Hver 30. minut, kl. 05-17 UTC (≈ 06/07-19 dansk tid), mandag-fredag.
    # Natten over må den gerne sove — første ping om morgenen vækker den,
    # så den er klar før folk møder ind.
    - cron: "*/30 5-17 * * 1-5"
  workflow_dispatch: {}  # manuel test-kørsel fra Actions-fanen

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping appen
        env:
          APP_URL: https://topas-tid-2tbajbfg2wkfyw7xpz9sfy.streamlit.app
        run: |
          # -f = fejl ved HTTP-fejlkoder, -sS = stille men vis fejl.
          # || exit 0: et fejlet ping må ikke larme som rød build —
          # appen vækkes alligevel af selve requestet.
          curl -fsS --max-time 60 -o /dev/null "$APP_URL" || exit 0
          echo "Pingede $APP_URL"
